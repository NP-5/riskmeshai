services:
  - type: web
    name: riskmesh-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - {key: RISKMESH_ENV, value: production}
      - {key: RISKMESH_API_TOKENS, sync: false}      # token:identity:role,... (tokens >= 16 chars)
      - {key: RISKMESH_PEPPER, generateValue: true}  # hashes recipient identifiers
      - {key: DATABASE_URL, fromDatabase: {name: riskmesh-db, property: connectionString}}
      - {key: RISKMESH_CORS_ORIGINS, value: "https://nareshpavan-riskmesh-ai.hf.space"}
      - {key: PAYPAL_CLIENT_ID, sync: false}
      - {key: PAYPAL_CLIENT_SECRET, sync: false}
      - {key: PAYPAL_WEBHOOK_ID, sync: false}
      - {key: PAYPAL_BASE, value: "https://api-m.sandbox.paypal.com"}
databases:
  - name: riskmesh-db
    plan: free
