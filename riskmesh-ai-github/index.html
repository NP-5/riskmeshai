function graphSvg(g){const cols=["capture","customer","account","device","ip","instrument","payout_item","transaction","dispute","beneficiary","merchant"],by={};g.nodes.forEach(n=>(by[n.type]??=[]).push(n));const used=cols.filter(c=>by[c]),pos={};
used.forEach((t,i)=>by[t].forEach((n,j)=>pos[n.id]=[60+i*(780/Math.max(used.length-1,1)),30+j*(340/Math.max(by[t].length,1))]));
return `<svg viewBox="0 0 900 420" class="w-full h-auto bg-[#f6f9fc] rounded-lg">${g.edges.map(e=>pos[e.source]&&pos[e.target]?`<line x1="${pos[e.source][0]}" y1="${pos[e.source][1]}" x2="${pos[e.target][0]}" y2="${pos[e.target][1]}" stroke="#A9B6CC" stroke-width="1" opacity=".6"/>`:"").join("")}
${g.nodes.map(n=>`<g><circle cx="${pos[n.id][0]}" cy="${pos[n.id][1]}" r="9" fill="${{customer:"#5D87FF",capture:"#5D87FF",device:"#FFAE1F",ip:"#7a5af8",instrument:"#13DEB9",payout_item:"#13DEB9",dispute:"#FFAE1F",beneficiary:"#FA896B",transaction:"#A9B6CC",account:"#5A6A85"}[n.type]||"#999"}"/><text x="${pos[n.id][0]}" y="${pos[n.id][1]+22}" font-size="9" text-anchor="middle" fill="#5A6A85">${esc(n.label.slice(0,14))}</text></g>`).join("")}
${used.map((t,i)=>`<text x="${60+i*(780/Math.max(used.length-1,1))}" y="410" font-size="11" font-weight="600" text-anchor="middle" fill="#2A3547">${t.replace("_"," ")}</text>`).join("")}</svg>`}
const tag=e=>pill(`${e.id} · ${e.polarity}${e.strength?" "+e.strength:""}`,e.polarity);
const TH=a=>`<tr class="text-left text-[#5A6A85]">${a.map(x=>`<th class="py-2 pr-4 font-semibold">${x}</th>`).join("")}</tr>`,TD="py-2 pr-4 align-top border-t border-[#e5eaef]";
async function show(id){
 const [v,g,au,cs]=await Promise.all([api(`/cases/${id}`),api(`/cases/${id}/graph`),api(`/cases/${id}/audit`),api("/cases")]);CASES=cs;const r=v.ring,f=v.fusion,c=v.critic,s=v.simulation,h=v.human,IN="w-full rounded-lg border border-[#e5eaef] bg-[#f6f9fc] px-3 py-2.5 text-sm mb-3 focus:outline-none focus:border-[#5D87FF]";
 shell(`<a href="#/dashboard" class="text-sm font-semibold text-[#5D87FF]">← Dashboard</a>
 <div class="flex flex-wrap items-center gap-3 mt-2 mb-6"><h1 class="text-2xl font-extrabold">${v.case_id} · ${esc(v.title)}</h1>${pill(v.status,"warn")}<span class="text-sm text-[#5A6A85]">${r.n_members} linked payers</span></div>
 <div class="grid grid-cols-2 xl:grid-cols-4 gap-4 mb-6">${kpi("Risk score",r.structural+"/100","#FA896B")}${kpi("Indicators fired",r.escalation+" of "+v.rule_results.length+" rules","#FFAE1F")}${kpi("Payout value to "+esc(r.top_beneficiary),inr(r.exposure_inr))}${kpi("Payout concentration",(r.concentration*100).toFixed(0)+"%","#13DEB9")}</div>
 <div class="${CARD}"><div class="${H}">Entity graph</div>${graphSvg(g)}<p class="text-xs text-[#5A6A85] mt-3">Linked captures: ${r.members.join(", ")||"–"}</p></div>
 <div class="${CARD}"><div class="${H}">Evidence & rules</div><div class="overflow-x-auto"><table class="w-full text-sm">${TH(["ID","Family","Statement","Signal"])}${v.evidence.map(e=>`<tr><td class="${TD} font-bold">${e.id}</td><td class="${TD}">${e.family}</td><td class="${TD}">${esc(e.statement)}${e.signal?` <i class="text-[#5A6A85]">→ ${esc(e.signal)}</i>`:""}</td><td class="${TD}">${tag(e)}</td></tr>`).join("")}</table></div>
 <div class="${H} mt-6">Rule results (${v.active_rule})</div>${v.rule_results.map(x=>`<p class="text-sm mb-2"><b>${x.rule_id}</b> → ${pill(x.decision,"warn")} conf ${x.confidence} — ${esc(x.reason)} <span class="text-[#5A6A85]">[${x.evidence.join(", ")}]</span></p>`).join("")||'<p class="text-sm">No rule fired.</p>'}</div>
 
 <div class="grid lg:grid-cols-2 gap-6"><div class="${CARD}"><div class="${H}">What the evidence establishes</div><ul class="list-disc pl-5 text-sm space-y-1.5">${v.established.map(e=>`<li>${esc(e.statement)} <span class="text-[#5A6A85]">[${e.evidence}]</span></li>`).join("")}</ul></div>
 <div class="${CARD}"><div class="${H}">What it does not establish</div><ul class="list-disc pl-5 text-sm space-y-1.5">${v.not_established.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div></div>
 <div class="${CARD}"><div class="${H}">AI investigation · ${esc(JSON.stringify(v.ai_provider.fusion||"not run"))}</div><div class="flex flex-wrap gap-2"><button class="${B1}" onclick="step('${id}','investigate')">Re-run investigation</button></div>
 ${v.conversation_signals?`<div class="${H} mt-6">Conversation evidence</div>${v.conversation_signals.map(x=>`<p class="text-sm mb-2">${esc(x.signal)} ${pill(x.evidence+" · "+x.confidence,x.polarity)}</p>`).join("")||'<p class="text-sm">No contextual signals.</p>'}`:""}
 ${f?`<div class="${H} mt-6">Investigation summary · risk ${f.confidence}</div><p class="text-sm mb-2">${esc(f.risk_summary)}</p><ul class="list-disc pl-5 text-sm text-[#5A6A85]">${f.missing_information.map(m=>`<li>${esc(m)}</li>`).join("")}</ul>`:""}
 ${c?`<div class="${H} mt-6">Critic review ${pill(c.verdict)} ${c.recommended_confidence}</div><p class="text-sm mb-2">${esc(c.alternative_explanation)}</p><ul class="list-disc pl-5 text-sm text-[#5A6A85]">${c.weaknesses.map(m=>`<li>${esc(m)}</li>`).join("")}</ul>`:""}</div>
 <div class="${CARD} border-l-4 border-l-[#5D87FF]"><div class="${H}">Recommended action</div><p class="text-sm"><b>${v.recommendation.action}</b> — ${esc(v.recommendation.scope)}. Human review ${v.recommendation.human_review_required?"required":"not required"}.</p></div>
 ${v.acts.length?`<div class="${CARD}"><div class="${H}">Proposed actions · human approval required</div><div class="overflow-x-auto"><table class="w-full text-sm">${TH(["Action","Target","Status","Decided by",""])}${v.acts.map(a=>`<tr><td class="${TD}">${esc(a.type)}</td><td class="${TD} font-bold">${esc(a.target)}</td><td class="${TD}">${pill(a.status,a.status==="REJECTED"?"supports":a.status==="PENDING"?"warn":"contradicts")}</td><td class="${TD} text-[#5A6A85]">${esc(a.by)}${a.mode?" · "+esc(a.mode):""}</td><td class="${TD}">${a.status==="PENDING"?`<button class="${B1} !px-3 !py-1.5" onclick="actDec('${a.id}','approve')">Approve</button> <button class="${B3} !px-3 !py-1.5" onclick="actDec('${a.id}','reject')">Reject</button>`:""}</td></tr>`).join("")}</table></div><p class="text-xs text-[#5A6A85] mt-3">${esc(v.sim_note)}</p></div>`:""}
 <div class="${CARD}"><div class="${H}">Human decision</div>${h?`<p class="text-sm">Automated: <b>${h.automated_decision}</b> · Human: <b>${h.human_decision}</b> by ${esc(h.actor)}${h.override?" (override)":""}<br>Reason: ${esc(h.human_reason)||"–"}</p>`:
 (v.pending_n?`<input id="why" class="${IN}" placeholder="Reason (recorded in the audit log)"><div class="flex gap-2"><button class="${B1}" onclick="dec('${id}','approve')">Approve all pending actions</button><button class="${B3}" onclick="dec('${id}','reject')">Reject all pending actions</button></div>`:'<p class="text-sm text-[#5A6A85]">Nothing is awaiting a decision for this investigation.</p>')}
 </div>
 <div class="${CARD}"><div class="${H}">Audit trail</div><table class="w-full text-sm">${au.map(a=>`<tr><td class="${TD}">${a.timestamp.slice(11,19)}</td><td class="${TD}">${a.actor}</td><td class="${TD}">${a.action}</td><td class="${TD} text-[#5A6A85]">${esc(a.reason).slice(0,110)}</td></tr>`).join("")}</table><button class="${B1} mt-3 mr-3" onclick="exportCsv('${id}')">Download CSV (Excel)</button><button class="inline-block mt-3 text-sm font-semibold text-[#5D87FF]" onclick="exportCase('${id}')">View export bundle (manifest)</button><pre id="exp" class="text-xs bg-[#f6f9fc] rounded-lg p-4 mt-3 max-h-64 overflow-auto whitespace-pre-wrap hidden"></pre></div>`,id)}
async function exportCase(id){const e=await api(`/cases/${id}/export`),p=$("#exp");p.textContent=JSON.stringify(e.manifest||e,null,1);p.classList.remove("hidden")}
async function exportCsv(id){const [v,au]=await Promise.all([api(`/cases/${id}`),api(`/cases/${id}/audit`)]);
const q=x=>{let t=String(x??"");if(/^[=+@]/.test(t))t="'"+t;return `"${t.replace(/"/g,'""')}"`},row=a=>a.map(q).join(","),r=v.ring,L=[];
L.push(row(["RiskMesh AI case report"]),row(["Case",v.case_id]),row(["Status",v.status]),row(["Linked payers",r.n_members]),row(["Risk score (out of 100)",r.structural]),row(["Indicators fired",r.escalation]),row(["Recipient",r.top_beneficiary]),row(["Payout value (USD)",r.exposure_inr]),row(["Beneficiary concentration",(r.concentration*100).toFixed(0)+"%"]),row(["Rule version",v.active_rule]),"");
L.push(row(["EVIDENCE"]),row(["ID","Family","Statement","Signal","Polarity","Strength"]),...v.evidence.map(e=>row([e.id,e.family,e.statement,e.signal,e.polarity,e.strength])),"");
L.push(row(["RULE RESULTS"]),row(["Rule","Decision","Confidence","Reason","Evidence"]),...v.rule_results.map(x=>row([x.rule_id,x.decision,x.confidence,x.reason,(x.evidence||[]).join(" ")])),"");
if(v.recommendation)L.push(row(["RECOMMENDATION"]),row(["Action","Scope","Human review required"]),row([v.recommendation.action,v.recommendation.scope,v.recommendation.human_review_required?"Yes":"No"]),"");
if(v.human)L.push(row(["HUMAN DECISION"]),row(["Automated","Human","Actor","Override","Reason"]),row([v.human.automated_decision,v.human.human_decision,v.human.actor,v.human.override?"Yes":"No",v.human.human_reason]),"");
L.push(row(["AUDIT TRAIL"]),row(["Time","Actor","Action","Reason"]),...au.map(a=>row([a.timestamp,a.actor,a.action,a.reason])));
const u=URL.createObjectURL(new Blob(["\ufeff"+L.join("\r\n")],{type:"text/csv;charset=utf-8"})),a=document.createElement("a");a.href=u;a.download=id+"_report.csv";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}
async function step(id,s){try{const r=await post(`/cases/${id}/${s}`);if(r&&r.id&&r.id!==id)location.hash="#/case/"+r.id;else show(id)}catch(e){alert(e.message)}}
async function dec(id,k){try{await post(`/cases/${id}/${k}`,{actor:"analyst_demo",reason:$("#why").value});show(id)}catch(e){alert(e.message)}}
async function note(id){const t=$("#note").value;if(t){await post(`/cases/${id}/comment`,{actor:"analyst_demo",text:t});show(id)}}

function route(){const h0=location.hash;$("#chat").style.display=(h0==="#/dashboard"||h0.startsWith("#/case/"))?"block":"none";const h=location.hash;(h.startsWith("#/case/")?show(h.slice(7)):h==="#/dashboard"?dashboard():landing()).catch(e=>mount(`<div class="p-10 text-center"><p class="font-bold">Unable to load</p><p class="text-sm text-[#5A6A85]">${esc(e.message)}</p></div>`))}
addEventListener("hashchange",route);chatRender();route();
setTimeout(()=>{$("#splash").classList.add("out");setTimeout(()=>$("#splash").remove(),700)},2400);
</script></body></html>
