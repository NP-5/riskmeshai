<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RiskMesh AI</title>
<style>
:root{--bg:#0f1318;--panel:#171d25;--line:#2a3442;--tx:#e6ebf2;--mut:#93a1b5;--ok:#3ecf8e;--warn:#f5b84b;--bad:#ff6b6b;--acc:#6aa8ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,Segoe UI,sans-serif}
header{display:flex;gap:12px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{font-size:17px;margin:0}h2{font-size:15px;margin:18px 0 8px}h3{font-size:13px;margin:12px 0 6px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
nav button,button{background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:6px 11px;cursor:pointer;font:inherit}
nav button.on{border-color:var(--acc);color:var(--acc)}button.go{border-color:var(--ok);color:var(--ok)}button.no{border-color:var(--bad);color:var(--bad)}button:disabled{opacity:.4;cursor:not-allowed}
input{background:#0b0f14;color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:6px 9px;font:inherit;min-width:240px}
main{padding:16px 18px;max-width:1150px;margin:auto}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.grow{flex:1}.mut{color:var(--mut)}.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid}
.HOLD,.FAIL,.REJECTED,.CONFLICT,.FAILED{color:var(--bad);border-color:var(--bad)}.REVIEW,.UNKNOWN,.PENDING,.UNCERTAIN,.CANNOT{color:var(--warn);border-color:var(--warn)}.RELEASE,.PASS,.VERIFIED,.EXECUTED,.SIMULATED{color:var(--ok);border-color:var(--ok)}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}th{color:var(--mut);font-weight:600;font-size:12px}
.banner{background:#2a2310;border:1px solid var(--warn);color:var(--warn);border-radius:8px;padding:8px 12px;margin:10px 0}.err{background:#2a1313;border:1px solid var(--bad);color:var(--bad);border-radius:8px;padding:8px 12px;margin:10px 0}
details{margin:4px 0}summary{cursor:pointer}ul{margin:4px 0 4px 18px;padding:0}
</style></head><body>
